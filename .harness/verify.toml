[[command]]
name = "selftest"
argv = ["uv", "run", "--frozen", "--no-sync", "agenthan", "selftest"]
timeout_sec = 60

[[command]]
name = "pytest"
argv = ["uv", "run", "--frozen", "--no-sync", "pytest", "-q"]
timeout_sec = 120

[[command]]
name = "lint"
argv = ["uv", "run", "--frozen", "--no-sync", "ruff", "check", "."]
timeout_sec = 60

[[command]]
name = "format"
argv = ["uv", "run", "--frozen", "--no-sync", "ruff", "format", "--check", "."]
timeout_sec = 60
