# 새 worktree에는 .venv가 없으므로 --no-sync 대신 잠금 파일·로컬 캐시로 설치한다(--frozen --offline).
# 구현자(Codex)의 네트워크를 연다. 실제 CLOVA·NAVER 검색 응답을 구현 중에 확인하기 위해서다.
network = true
# 아래 [[command]]의 env 값을 구현자에게도 넘긴다. geass#18부터 network와 별도 설정이다.
implement_env = true

[[command]]
name = "pytest"
argv = ["uv", "run", "--frozen", "--offline", "pytest", "-q", "-rs", "--tb=short"]
timeout_sec = 120

# 실제 CLOVA·NAVER API HUB(검색) 테스트. 이 명령에만 키를 넘긴다(값은 하네스가 로그에서 가린다).
# test_place_matcher의 실제 임베딩 평가(약 130초, 병렬 실행 시 429로 흔들림)는 뺀다.
# 매칭 코드(place_matcher.py·카탈로그)를 고치는 Issue나 팀 레포 PR 전에는 사람이 따로 돌린다:
#   uv run --env-file .env pytest -q -m network tests/test_place_matcher.py
[[command]]
name = "api"
argv = ["uv", "run", "--frozen", "--offline", "pytest", "-q", "-m", "network", "-rs", "--tb=short",
        "--deselect", "tests/test_place_matcher.py::test_live_clova_dataset"]
env = ["CLOVASTUDIO_API_KEY", "NAVER_API_HUB_CLIENT_ID", "NAVER_API_HUB_CLIENT_SECRET"]
timeout_sec = 300

[[command]]
name = "lint"
argv = ["uv", "run", "--frozen", "--offline", "ruff", "check", "."]
timeout_sec = 60

[[command]]
name = "format"
argv = ["uv", "run", "--frozen", "--offline", "ruff", "format", "--check", "."]
timeout_sec = 60
