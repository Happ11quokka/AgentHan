[project]
name = "agenthan"
version = "0.1.0"
description = "네이버 클라우드 기반 소상공인 AI 비서"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.5",
    "joblib>=1.6.0",
    "langgraph>=1.2.20,<1.3",
    "numpy>=2.4.6",
    "openai>=1.40",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    # models/baseline.joblib이 1.9.1로 저장됨. 버전을 바꾸면 scripts/train_baseline.py로 재학습
    "scikit-learn>=1.9.1,<1.10",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not network"'
markers = ["network: live CLOVA API tests (requires CLOVASTUDIO_API_KEY)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
