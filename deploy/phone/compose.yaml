# 전화 주문 배포 (티켓 09): app(FastAPI, 화면 + /api/phone/ws) + caddy(자동 HTTPS)
#                            + db(PostgreSQL 17 + pgvector, 가게 지식·벡터·주문. docs/db.md)
#
#   저장소 루트에서:  ./deploy/phone/deploy.sh up
#   (먼저 빌드 → 새 통화 받기 중지 → 통화 0개 대기 → 교체 → 오래된 이미지 정리. README 4절)
#   손으로 할 때:     docker compose -f deploy/phone/compose.yaml up -d --build  (통화 중인 손님이 끊긴다)
#
# 값은 이 폴더의 .env(서버에만 있음, git·이미지에 안 들어감)에서 온다. 틀은 .env.example.
name: agenthan-phone

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/phone/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev} # /healthz의 version. deploy.sh up이 커밋 해시를 넣는다
    image: agenthan-phone:latest
    restart: unless-stopped
    # 키는 실행할 때 환경 변수로만 들어간다. 8000은 밖에 열지 않는다(Caddy만 붙는다)
    env_file: .env
    environment:
      # Caddy 뒤라 소켓 상대는 늘 Caddy 컨테이너(사설 주소)다. 8000은 밖에 안 열려 있어 사설 대역의
      # 프록시만 믿고 X-Forwarded-For에서 손님 주소를 읽는다 (IP별 통화 상한, 6단계)
      PHONE_TRUSTED_PROXIES: ${PHONE_TRUSTED_PROXIES:-private}
      # 이 도메인의 화면에서만 통화를 건다. 다른 주소(터널 등)로도 열 때는 .env에 쉼표로 적는다
      PHONE_ALLOWED_ORIGINS: ${PHONE_ALLOWED_ORIGINS:-https://${DOMAIN}}
    expose:
      - "8000"
    volumes:
      - phone_logs:/app/logs # 통화 기록 JSONL, 하루 예산(phone-budget.json), 점검 표시(DRAIN)
    # DB는 먼저 띄우기만 한다(건강할 때까지 안 기다림). DB가 없거나 죽어도 앱은 JSON 파일로 뜬다
    depends_on:
      - db
    # SIGTERM → 통화 중인 화면에 안내(1초) → uvicorn 종료(최대 8초). 그 안에 못 끝내면 강제 종료
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Caddy에는 키를 주지 않는다. 도메인과 ACME 주소만
    environment:
      DOMAIN: ${DOMAIN:?deploy/phone/.env에 DOMAIN을 적어 주세요}
      ACME_CA: ${ACME_CA:-https://acme-staging-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # 인증서·ACME 계정. 지우면 재발급(LE 한도 주의)
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 가게 지식·벡터(pgvector)·전화 주문·비서 가게 사본. 밖에 포트를 열지 않는다(app만 붙는다).
  # 앱은 .env의 AGENTHAN_DB_URL=postgresql://agenthan:<비밀번호>@db:5432/agenthan 로 붙는다.
  # 스키마·데이터: docker compose run --rm app python -m agenthan.db.seed (docs/db.md)
  db:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenthan
      POSTGRES_DB: agenthan
      POSTGRES_PASSWORD: ${AGENTHAN_DB_PASSWORD:-}
    volumes:
      - pg_data:/var/lib/postgresql/data # 지우면 DB가 빈다(시드로 다시 채울 수 있음, 주문 기록은 사라짐)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthan -d agenthan"]
      interval: 10s
      timeout: 3s
      retries: 5
    shm_size: 256mb
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  phone_logs:
